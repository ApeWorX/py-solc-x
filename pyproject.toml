[build-system]
requires = ["setuptools>=75.6.0", "wheel", "setuptools_scm[toml]>=5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-solc-x"
description = "Python wrapper and version management tool for the solc Solidity compiler."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4"
authors = [{ name = "ApeWorX Ltd.", email = "admin@apeworx.io" }]
keywords = ["ethereum", "solidity", "solc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
dependencies = [
    "requests>=2.19.0,<3",
    "packaging>=23.1",
]

[project.urls]
Homepage = "https://github.com/ApeWorX/py-solc-x"
Repository = "https://github.com/ApeWorX/py-solc-x"
Issues = "https://github.com/ApeWorX/py-solc-x/issues"
Documentation = "https://solcx.readthedocs.io/en/latest/"

[dependency-groups]
test = [
    "pytest>=6.0",
    "pytest-xdist",
    "pytest-cov",
    "pytest-mock",
    "hypothesis>=6.2.0,<7.0",
]
lint = [
    "ruff>=0.12.0",
    "mypy>=1.13.0,<2",
    "types-setuptools",
    "types-requests",
    "mdformat>=0.7.19",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "mdformat-pyproject>=0.0.2",
]
docs = [
    "myst-parser>=4.0.0",
    "sphinx-click>=6.0.0",
    "Sphinx>=8.0.0",
    "sphinx_rtd_theme>=3.0.0",
    "sphinxcontrib-napoleon>=0.7",
    "sphinx-plausible>=0.1.2,<0.2",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    "commitlint",
    "prek",
    "pytest-watch",
    "IPython",
    "ipdb",
]

[tool.setuptools]
packages = ["solcx", "solcx.utils"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
solcx = ["py.typed"]

[tool.setuptools_scm]
write_to = "solcx/version.py"

[tool.mypy]
exclude = "build/"
check_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "C4", "UP", "RET", "SIM", "S", "TCH", "T10", "FIX",
]
ignore = [
    "E501",
    "B904", "B905", "B006", "B007", "B012", "B028", "B018",
    "FIX002", "FIX004",
    "SIM102", "SIM105", "SIM108", "SIM113", "SIM114", "SIM115", "SIM116", "SIM117",
    "RET501", "RET502", "RET503", "RET504", "RET505", "RET506", "RET507", "RET508",
    "S101", "S102", "S105", "S110", "S112", "S113", "S202", "S307", "S311", "S603", "S607",
    "C400", "C416", "C408", "C417", "C414", "C401", "C409", "C419",
    "SIM101", "SIM103", "SIM110", "SIM118", "SIM401", "SIM910",
    "TC001", "TC003", "TC006",
    "UP028",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["D", "E501", "S101", "B011"]
"**/conftest.py" = ["F401", "F841"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["solcx"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
addopts = """
    --cov-branch
    --cov-report term
    --cov-report html
    --cov-report xml
    --cov=solcx
"""
python_files = "test_*.py"
testpaths = "tests"
markers = "fuzzing: Run Hypothesis fuzz test suite"

[tool.mdformat]
number = true
